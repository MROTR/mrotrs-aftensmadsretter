# yaml-language-server: $schema=../schemas/recipe.schema.json
id: harira
title: Harira
source: https://www.valdemarsro.dk/harira-marokkansk-suppe/
image: ../Files/images/harira.jpg
servings: 4
standard_kcal_per_portion: 650
time:
  total_min: 35
  active_min: 20
tags:
  - vegetar
  - vegansk
  - suppe
  - marokkansk
  - linser
  - kikærter
notes: "Marokkansk fyldig suppe med røde linser og kikærter. De sprøde ristede kikærter til topping kan slås til/fra som modul."

components:
  - id: suppe_base
    title: Til suppen
    role: base
    default_enabled: true
    evaporation_factor: 0.92
    ingredients:
      - ref: spidskommen
        item: spidskommen
        label: stødt spidskommen
        amount: 15
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: koriander_stoedt
        item: stødt koriander
        amount: 15
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: olie
        item: olivenolie
        amount: 30
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: loeg
        item: løg
        amount: 2
        unit: stk
        prep: finthakkede
      - ref: hvidloeg
        item: hvidløg
        amount: 3
        unit: fed
        prep: finthakkede
      - ref: bladselleri
        item: bladselleri
        label: stængler bladselleri
        amount: 2
        unit: stk
        grams_override: 80
        prep: skåret i tern
      - ref: tomatpure
        item: tomatpuré
        amount: 50
        unit: g
      - ref: tomater
        item: hakkede tomater
        amount: 400
        unit: g
        display_unit: dåse
        scaling: whole_unit
      - ref: squash
        item: squash
        amount: 100
        unit: g
        prep: groftrevet
      - ref: gurkemeje
        item: gurkemeje
        label: stødt gurkemeje
        amount: 5
        unit: ml
        display_unit: tsk
        scaling: sublinear
      - ref: ingefaer
        item: ingefær
        amount: 15
        unit: ml
        display_unit: spsk
        prep: fintrevet
      - ref: chili
        item: chili
        label: rød chili
        amount: 0.5
        unit: stk
        prep: finthakket
      - ref: soed_paprika
        item: paprika
        label: sød paprika
        amount: 5
        unit: ml
        display_unit: tsk
      - ref: roeget_paprika
        item: paprika
        label: røget paprika
        amount: 5
        unit: ml
        display_unit: tsk
      - ref: safran
        item: safran
        label: stødt safran
        amount: 1
        unit: knivspids
      - ref: bouillon
        item: grøntsagsbouillon
        amount: 1000
        unit: ml
        display_unit: l
      - ref: kikaerter
        item: kikærter_dåse
        label: kikærter (drænet)
        amount: 240
        unit: g
        display_unit: dåse
        prep: drænede og skyllede
        scaling: whole_unit
      - ref: linser
        item: røde linser
        amount: 75
        unit: g
      - ref: citronsaft
        item: citronsaft
        label: saft af 0,5 citron
        amount: 20
        unit: ml
        display_unit: spsk
      - item: salt
        label: Salt
        amount: null
      - item: peber
        label: Friskkværnet peber
        amount: null

  - id: ristede_kikaerter
    title: Til ristede kikærter (topping)
    role: side
    default_enabled: true
    ingredients:
      - ref: top_kikaerter
        item: kikærter_dåse
        label: kikærter (drænet)
        amount: 240
        unit: g
        display_unit: dåse
        prep: drænede og skyllede
        scaling: whole_unit
      - ref: top_olie
        item: olivenolie
        amount: 15
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: top_paprika
        item: paprika
        label: røget paprika
        amount: 2.5
        unit: ml
        display_unit: tsk
      - ref: top_salt
        item: salt
        label: flagesalt
        amount: 5
        unit: ml
        display_unit: tsk
      - ref: mynte
        item: mynte
        label: frisk mynte
        amount: 1
        unit: håndfuld
        optional: true
      - ref: persille
        item: persille
        label: frisk persille
        amount: 1
        unit: håndfuld
        optional: true

steps:
  - section: Harira suppe
    component_id: suppe_base
    items:
      - "Tænd ovnen på 175°C varmluft, hvis du vil lave ristede kikærter."
      - "Rist {spidskommen} og {koriander_stoedt} i en tør gryde ved middel varme i 30–60 sekunder, til det dufter."
      - "Tilsæt {olie}, {loeg} og {hvidloeg}. Sautér 5–7 minutter, til løgene er bløde og klare."
      - "Tilsæt {bladselleri} og sautér 2 minutter."
      - "Tilsæt {tomatpure} og steg 1 minut, til den dufter mere \"ristet\"."
      - "Tilsæt {tomater}, {squash}, {gurkemeje}, {ingefaer}, {chili}, {soed_paprika}, {roeget_paprika} og {safran}."
      - "Hæld {bouillon} i og tilsæt {kikaerter} og {linser}. Bring i kog."
      - "Læg låg på, skru ned og lad suppen simre 20–25 minutter, til linserne er møre og suppen er let cremet."
      - "Smag til med {citronsaft}, salt og friskkværnet peber."
  - section: Ristede kikærter
    component_id: ristede_kikaerter
    items:
      - "Vend {top_kikaerter} med {top_olie}, {top_paprika} og {top_salt}. Fordel dem på en bageplade med bagepapir."
      - "Bag i 20–25 minutter, til de er sprøde og let gyldne. Vend dem et par gange undervejs."
      - "Server suppen rygende varm med ristede kikærter og evt. {mynte} og {persille} på toppen."
