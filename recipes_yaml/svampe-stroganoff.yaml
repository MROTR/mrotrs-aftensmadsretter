# yaml-language-server: $schema=../schemas/recipe.schema.json
id: svampe-stroganoff
title: Svampe stroganoff
source: https://www.valdemarsro.dk/svampe-stroganoff/
image: ../Files/images/svampe-stroganoff.jpg
servings: 4
standard_kcal_per_portion: 650
time:
  total_min: 45
  active_min: 30
tags:
  - vegetar
  - svampe
  - gryderet
  - ris
notes: "3 dl brune ris = ca. 300 g tørvægt (ca. 750 g kogt). Svampe afgiver og fordamper væske ved hård stegning."

components:
  - id: stroganoff_base
    title: Til stroganoff
    role: base
    default_enabled: true
    evaporation_factor: 0.85
    ingredients:
      - ref: olie
        item: olivenolie
        amount: 15
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: smoer
        item: smør
        amount: 15
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: champignon
        item: champignon
        amount: 250
        unit: g
        prep: skåret i kvarte
      - ref: svampe
        item: svampe
        label: andre svampe (f.eks. kantareller)
        amount: 225
        unit: g
        prep: groft skåret
      - ref: loeg
        item: løg
        amount: 2
        unit: stk
        prep: finthakkede
      - ref: hvidloeg
        item: hvidløg
        amount: 4
        unit: fed
        prep: finthakkede
      - ref: soed_paprika
        item: paprika
        label: sød paprika
        amount: 15
        unit: ml
        display_unit: spsk
      - ref: roeget_paprika
        item: paprika
        label: røget paprika
        amount: 15
        unit: ml
        display_unit: spsk
      - ref: mel
        item: hvedemel
        amount: 15
        unit: ml
        display_unit: spsk
      - ref: tomatpure
        item: tomatpuré
        amount: 75
        unit: ml
        display_unit: spsk
      - ref: bouillon
        item: grøntsagsbouillon
        amount: 200
        unit: ml
        display_unit: dl
      - ref: floede
        item: piskefløde
        amount: 100
        unit: ml
        display_unit: dl
      - item: salt
        label: Salt
        amount: null
      - item: peber
        label: Friskkværnet sort peber
        amount: null

  - id: ris_carb
    title: Til servering (brune ris)
    role: carb
    default_enabled: true
    ingredients:
      - ref: ris
        item: brune ris
        amount: 300
        unit: ml
        display_unit: dl
        prep: kogt efter anvisning på pakken
      - ref: persille
        item: persille
        label: bredbladet persille
        amount: 1
        unit: håndfuld
        prep: grofthakket

steps:
  - section: Svampe stroganoff
    component_id: stroganoff_base
    items:
      - "Kog {ris} efter anvisningen på pakken."
      - "Varm {olie} og {smoer} op på en stor pande ved høj varme. Steg {champignon} 6–8 minutter, til de får stegeskorpe og væden er fordampet."
      - "Skru ned til middel varme. Tilsæt {svampe}, {loeg} og {hvidloeg} og sautér 5–7 minutter, til løgene er bløde."
      - "Drys {soed_paprika}, {roeget_paprika} og {mel} over og rør rundt i 30 sekunder."
      - "Tilsæt {tomatpure}, {bouillon} og {floede}. Lad det simre 10 minutter, til saucen er cremet og kan dække bagsiden af en ske."
      - "Smag til med salt og friskkværnet peber. Server med {ris} og {persille}."
