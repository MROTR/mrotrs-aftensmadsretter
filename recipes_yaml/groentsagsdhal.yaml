# yaml-language-server: $schema=../schemas/recipe.schema.json
id: groentsagsdhal
title: Grøntsagsdhal
source: https://www.valdemarsro.dk/groentsagsdhal/
image: ../Files/images/groentsagsdhal.jpg
servings: 4
standard_kcal_per_portion: 650
time:
  total_min: 45
  active_min: 20
tags:
  - vegetar
  - indisk
  - dhal
  - linser
  - grøntsager
  - gryderet
  - fryseegnet
notes: "Fyldig grøntsagsdhal med røde linser, gulerødder, squash, blomkål og babyspinat i en cremet kokos- og karrybase. Serveres med basmatiris, saltede mandler og græsk yoghurt."

components:
  - id: dhal_base
    title: Til grøntsagsdhal
    role: base
    default_enabled: true
    evaporation_factor: 0.90
    ingredients:
      - ref: olie
        item: olivenolie
        amount: 30
        unit: ml
        display_unit: spsk
        scaling: sublinear
      - ref: loeg
        item: løg
        amount: 2
        unit: stk
        prep: finthakket
      - ref: karry
        item: karry
        label: mediumstærk karry
        amount: 15
        unit: ml
        display_unit: tsk
        scaling: sublinear
      - ref: chiliflager
        item: chiliflager
        amount: 2.5
        unit: ml
        display_unit: tsk
        scaling: sublinear
      - ref: spidskommen
        item: spidskommen
        label: stødt spidskommen
        amount: 5
        unit: ml
        display_unit: tsk
        scaling: sublinear
      - ref: koriander_stoedt
        item: stødt koriander
        amount: 5
        unit: ml
        display_unit: tsk
        scaling: sublinear
      - ref: linser
        item: røde linser
        amount: 200
        unit: g
        prep: skyllet
      - ref: guleroedder
        item: gulerødder
        amount: 250
        unit: g
        prep: groftrevet
      - ref: squash
        item: squash
        amount: 150
        unit: g
        prep: i små tern
      - ref: hvidloeg
        item: hvidløg
        amount: 4
        unit: fed
        prep: fintrevet
      - ref: ingefaer
        item: ingefær
        amount: 30
        unit: ml
        display_unit: spsk
        prep: fintrevet
      - ref: bouillon
        item: grøntsagsbouillon
        amount: 400
        unit: ml
        display_unit: dl
      - ref: kokosmaelk
        item: kokosmælk
        amount: 400
        unit: ml
        display_unit: dåse
        scaling: whole_unit
      - ref: tomater
        item: hakkede tomater
        amount: 400
        unit: g
        display_unit: dåse
        scaling: whole_unit
      - ref: blomkaal
        item: blomkål
        amount: 200
        unit: g
        prep: finthakket
      - ref: spinat
        item: spinat
        label: babyspinat
        amount: 75
        unit: g
      - item: salt
        label: Salt
        amount: null
      - item: peber
        label: Friskkværnet peber
        amount: null

  - id: ris_carb
    title: Til servering (ris)
    role: carb
    default_enabled: true
    ingredients:
      - ref: ris
        item: basmatiris
        amount: 200
        unit: ml
        display_unit: dl

  - id: tilbehoer_side
    title: Tilbehør og topping ved servering
    role: side
    default_enabled: true
    ingredients:
      - ref: mandler
        item: mandler
        label: saltede mandler
        amount: 50
        unit: g
        prep: grofthakkede
      - ref: yoghurt
        item: græsk yoghurt 10
        label: græsk yoghurt 10 %
        amount: 100
        unit: ml
        display_unit: dl
      - ref: koriander_frisk
        item: koriander
        label: frisk koriander
        amount: 1
        unit: håndfuld
        prep: finthakket

steps:
  - section: Grøntsagsdhal
    component_id: dhal_base
    items:
      - "Kog {ris} efter anvisningen på pakken."
      - "Varm {olie} op i en stor gryde ved middel varme og sautér {loeg} i 4–5 minutter, til de er bløde og klare."
      - "Tilsæt {karry}, {chiliflager}, {spidskommen} og {koriander_stoedt}, og varm krydderierne igennem under omrøring i ca. 1 minut."
      - "Skyl {linser} i en sigte og kom dem i gryden sammen med {guleroedder}, {squash}, {hvidloeg}, {ingefaer}, {bouillon}, {kokosmaelk} og {tomater}."
      - "Bring i kog, læg låg på og lad retten simre ved svag varme i 20 minutter."
      - "Tilsæt {blomkaal}, rør godt rundt, læg låg på igen og lad simre i yderligere 10–15 minutter (tilsæt evt. en smule ekstra vand eller bouillon, hvis dhalen bliver for fast)."
      - "Smag til med salt og friskkværnet peber, og vend {spinat} i gryden, så den lige falder sammen."
      - "Server i dybe skåle med {ris}, toppet med {yoghurt}, {mandler} og et drys {koriander_frisk}."
