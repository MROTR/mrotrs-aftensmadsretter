name: Deploy Aftensmadsretter PWA to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Build recipes_data.js and validate YAML nutrition
        run: python tools/build_recipes.py

      - name: Copy local recipe images into webapp bundle
        run: |
          mkdir -p Files
          cp -r Files webapp/Files || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "webapp"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
