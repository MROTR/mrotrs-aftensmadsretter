<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Aftensmadsretter</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brandHome" role="button" tabindex="0">
        <span class="brand-icon">🍲</span>
        <div>
          <h1>Aftensmadsretter</h1>
          <span class="subtitle" id="headerSubtitle">Indlæser opskrifter…</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="shoppingNavBtn" class="chip-btn" title="Se ugeplan og supermarkeds-indkøbsliste">
          <span>🛒</span>
          <span id="shoppingNavText">Indkøbsliste (0)</span>
        </button>
        <button id="wakeLockBtn" class="chip-btn" title="Hold skærmen tændt mens du laver mad">
          <span class="dot" id="wakeDot"></span>
          <span id="wakeText">Skærmlås: Normal</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- CATALOG VIEW -->
    <section id="catalogView">
      <div class="controls-bar">
        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="Søg efter ret, ingrediens eller tag (f.eks. linser, hurtig, karry)…" />
        </div>
        <div class="filter-row" id="tagFilters"></div>
      </div>

      <div class="recipe-grid" id="recipeGrid"></div>
    </section>

    <!-- RECIPE DETAIL VIEW -->
    <section id="detailView" class="hidden">
      <div class="detail-nav">
        <button id="backBtn" class="back-btn">← Alle retter</button>
        <div style="display:flex; gap:8px;">
          <button id="addToPlanDetailBtn" class="snap-btn">🛒 + Tilføj til indkøbsliste</button>
          <button id="resetChecksBtn" class="secondary-btn">Nulstil flueben</button>
        </div>
      </div>

      <div id="recipeDetailContent"></div>
    </section>

    <!-- SHOPPING LIST & MEAL PLANNER VIEW -->
    <section id="shoppingView" class="hidden">
      <div class="detail-nav" style="flex-wrap:wrap; gap:10px;">
        <button id="backFromShoppingBtn" class="back-btn">← Tilbage til opskrifter</button>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="iosShortcutBtn" class="todo-primary-btn" title="Kopiér varer og kør iPhone-genvejen 'Tilføj Til To-do' som opretter hver linje som separat opgave i Microsoft To Do">
            📲 Tilføj til To Do (iPhone Genvej)
          </button>
          <button id="todoExportBtn" class="todo-btn" title="Kopiér ét punkt pr. linje (uden krydderier/afkrydsede) til udklipsholderen">
            ☑️ Kopiér til To Do
          </button>
          <button id="shareShoppingBtn" class="snap-btn" title="Del indkøbslisten via telefonens Del-menu (SMS, Messenger, Påmindelser, Noter)">
            📤 Del liste…
          </button>
          <button id="copyShoppingBtn" class="secondary-btn" title="Kopiér hele listen med overskrifter">
            📋 Kopiér alt
          </button>
          <button id="clearShoppingBtn" class="secondary-btn">Tøm ugeplan</button>
        </div>
      </div>

      <div id="shoppingContent"></div>
    </section>
  </main>

  <script src="./recipes_data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
